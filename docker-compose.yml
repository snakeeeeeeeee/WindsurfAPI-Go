services:
  windsurfapi-go-redis:
    image: redis:7-alpine
    container_name: windsurfapi-go-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data

  windsurfapi-go:
    build: .
    depends_on:
      - windsurfapi-go-redis
    ports:
      - "13456:3456"
    volumes:
      - ./data:/app/data
      - type: bind
        source: ./configs/default.yaml
        target: /app/configs/default.yaml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3456/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
